[package]
name = "egglog_python"
version = "13.2.1+fixed.1"
edition = "2024"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "egglog"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module", "num-bigint", "num-rational", "indexmap"] }
num-bigint = "*"
num-rational = "*"
indexmap = "2.12"
opentelemetry = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry-stdout = { version = "0.28", features = ["trace"] }
opentelemetry_sdk = "0.28"
# egglog = { path = "../egg-smol", default-features = false }
# egglog-bridge = { path = "../egg-smol/egglog-bridge" }
# egglog-core-relations = { path = "../egg-smol/core-relations" }
# egglog-ast = { path = "../egg-smol/egglog-ast" }
# egglog-reports = { path = "../egg-smol/egglog-reports" }
egglog = { git = "https://github.com/egraphs-good/egglog.git", rev = "2e5657b", default-features = false }
egglog-ast = { git = "https://github.com/egraphs-good/egglog.git", rev = "2e5657b" }
egglog-core-relations = { git = "https://github.com/egraphs-good/egglog.git", rev = "2e5657b" }
egglog-reports = { git = "https://github.com/egraphs-good/egglog.git", rev = "2e5657b" }
egglog-bridge = { git = "https://github.com/egraphs-good/egglog.git", rev = "2e5657b" }
egglog-experimental = { git = "https://github.com/egraphs-good/egglog-experimental", branch = "main", default-features = false }
egraph-serialize = { version = "0.3", features = ["serde", "graphviz"] }
serde_json = "1"
pyo3-log =  "*"
log = "0.4"
lalrpop-util = { version = "0.22", features = ["lexer"] }
ordered-float = "5"
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["v4"] }
rayon = "1.11"
base64 = "0.22.1"

# eggverse: fix for the bulk-`let` e-graph corruption (SymbolGen::fresh minted
# colliding internal names, conflating distinct globals during action
# compilation). See ../../fixes/20260827_upstream_issue/README.md.
# The patched core is vendored at ../egglog-fixed (egraphs-good/egglog
# e264c37a + fix). Both patch tables below are required: patch redirects
# cannot chain, so every referenced source must point at the local tree
# directly.
[patch.'https://github.com/egraphs-good/egglog.git']
egglog = { path = "../egglog-fixed" }
egglog-ast = { path = "../egglog-fixed/egglog-ast" }
egglog-core-relations = { path = "../egglog-fixed/core-relations" }
egglog-bridge = { path = "../egglog-fixed/egglog-bridge" }
egglog-reports = { path = "../egglog-fixed/egglog-reports" }
